name: Bug report
description: Something in WikiFrames does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WikiFrames! **Security problems must not be reported here** —
        see SECURITY.md. Please never paste participants' photos, campaign links or deletion links.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Participant flow (phone)
        - Canvas editor
        - Campaign setup / dashboard
        - Sign-in
        - Installation / self-hosting
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 130 on Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs or browser console output, with secrets removed.
