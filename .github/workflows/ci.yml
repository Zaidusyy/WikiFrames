name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKPOINT_DISABLE: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - name: Licences of production dependencies
        run: node scripts/licenses.mjs --check
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wikiframes:ci .

  # GitHub is the primary repository; gitlab.wikimedia.org carries an exact
  # copy (same commits) for Toolforge to build from. Only code that passed the
  # jobs above is copied, and nothing is ever force-pushed: if the copy has
  # diverged (someone committed on GitLab), this job fails instead.
  mirror:
    name: Mirror to Wikimedia GitLab
    runs-on: ubuntu-latest
    needs: [check, docker]
    if: github.event_name == 'push' && github.repository == 'Zaidusyy/WikiFrames'
    env:
      GITLAB_REPO: git@gitlab-ssh.wikimedia.org:zaidusyy/wikiframes.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_MIRROR_KEY: ${{ secrets.GITLAB_MIRROR_KEY }}
        run: |
          if [ -z "$GITLAB_MIRROR_KEY" ]; then
            echo "::notice::GITLAB_MIRROR_KEY is not set; skipping the mirror."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GITLAB_MIRROR_KEY" > ~/.ssh/gitlab_mirror
          chmod 600 ~/.ssh/gitlab_mirror
          # Host key published at wikitech.wikimedia.org/wiki/Help:SSH_Fingerprints/gitlab.wikimedia.org
          echo 'gitlab-ssh.wikimedia.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG5c7aJKGboKUMkoxxcpMhNw5PkRxWVN2RRzN0Bb9ZN2' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitlab_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote add gitlab "$GITLAB_REPO"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push gitlab "refs/tags/${GITHUB_REF_NAME}"
          else
            git push gitlab "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
